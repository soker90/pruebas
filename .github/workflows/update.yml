name: Test aur-maintainer

on:
  workflow_dispatch:
  push:
    branches:
      - 'test/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: soker90/aur-maintainer@main
        with:
          github-token: ${{ secrets.MAN_TOKEN }}
          update-branch: update
          base-branch: ${{ github.ref_name }}
          auto-merge: false
          aur-publish: false
